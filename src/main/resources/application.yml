spring:

  mail:
    host: smtp.naver.com
    port: 465
    username: ${NAVER_MAIL_USERNAME}
    password: ${NAVER_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true

  application:
    name: exam

  datasource:
    url: jdbc:mysql://localhost:3306/issueCheck
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  thymeleaf:
    cache: false
    prefix: file:src/main/resources/templates/

  logging:
    level:
      root: INFO
      com.issueCheck: DEBUG

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.project.exam
  configuration:
    map-underscore-to-camel-case: true